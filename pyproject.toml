[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-json-logger>=4.2.0",
    "logger>=1.4",
    "logging>=0.4.9.6",
]
[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]
[project.scripts]
prodml-train = "prodml.train:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
